services:
  - type: web
    name: ramayana-bms-monitor
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: BMS_URL
        sync: false
      - key: TARGET_DATES
        sync: false
      - key: CINEMA_NAME
        value: Broadway Cinemas
      - key: FORMAT_HINT
        value: IMAX
      - key: POLL_INTERVAL_MS
        value: "60000"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
